# Profit-Share Vault on SANDBOX — SCAFFOLDED BUT GUARDED.
# PSV is not deployed on sandbox today (GET /exchange serves profitShareVaultProviderV1ContractAddress
# = ZeroAddress), so `run --rm vaultgen` will REFUSE with "PSV is NOT deployed on this environment".
# Ready to activate once the Profit-Share provider ships on sandbox: set VAULT_PROVIDER in
# .env.STRATEGY to the live sandbox PSV provider and it works like the dev dir.
services:
  vaultgen:
    image: ghcr.io/nardis556/ikon-vaultgen:latest
    pull_policy: missing
    restart: "no"
    env_file:
      - { path: ../.env.sandbox, required: false }
      - { path: ../.env, required: false }
      - .env.STRATEGY
    environment:
      - NODE_ENV=production
      - MODE=provision
    volumes:
      - ./out:/app/out
      - ./state:/app/state

  animate:
    image: ghcr.io/nardis556/ikon-vaultgen:latest
    pull_policy: missing
    restart: unless-stopped
    env_file:
      - { path: ../.env.sandbox, required: false }
      - { path: ../.env, required: false }
      - .env.STRATEGY
    environment:
      - NODE_ENV=production
      - MODE=animate
      - EXECUTE=${EXECUTE:-0}
      - SEED_POSITIONS=${SEED_POSITIONS:-2}
    volumes:
      - ./out:/app/out
      - ./state:/app/state

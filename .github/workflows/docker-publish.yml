name: Build and publish container

# Publishes the vaultgen image to GitHub Container Registry (ghcr.io).
#
# GHCR needs NO secrets — it authenticates with the built-in GITHUB_TOKEN.
#
# No private registry credentials are needed either: @katanaperps/katana-perps-sdk is public.
# This project deliberately does NOT depend on @katanaperps/katana-perps-contracts-niseko-ma,
# which is not on the public registry (404 anonymously) and would force an npm token into CI.
# Its only use here was one adapter call, now made with a minimal ABI in src/vault.ts whose
# calldata is byte-identical (selector 0x5d303519, checked against that package's typechain ABI).
# If you ever re-add it, this workflow needs an NPM_TOKEN secret and an .npmrc in the build.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch: # lets you run it by hand from the Actions tab

env:
  REGISTRY: ghcr.io
  # ghcr.io/nardis556/ikon-vaultgen — lowercased automatically below.
  # Keep in sync with `image:` in docker/*/*/compose.yml.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR expects a lowercase image path; repo/owner casing can differ.
      - name: Normalise image name
        id: img
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # No secret-scanning step here, matching ikon-loadgen2. .dockerignore is what actually
      # keeps credentials out of the image: it excludes docker/ wholesale (the funding key, the
      # pool mnemonic, every manager and depositor key) plus .env*, so none of it is ever uploaded
      # to the builder. A filename-based CI guard added nothing and false-positived on the seven
      # committed .env.STRATEGY knob files, which are credential-free by design.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64, linux/arm64 # add ,linux/arm64 if you deploy on ARM
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "On the host: \`cd docker/demo && ./demo.sh check\`"
          } >> "$GITHUB_STEP_SUMMARY"
